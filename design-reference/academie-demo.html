          accent: "var(--accent)", "accent-deep": "var(--accent-deep)", "accent-soft": "var(--accent-soft)",
          field: "var(--field-bg)",
          sb: "var(--sb-bg)", "sb-fg": "var(--sb-fg)", "sb-soft": "var(--sb-soft)", "sb-line": "var(--sb-line)",
        },
        fontFamily: {
          sans: ['"Hanken Grotesk"', "system-ui", "sans-serif"],
          display: ['"Spectral"', "serif"],
        },
        borderRadius: { xl2: "16px" },
      },

    corePlugins: { preflight: true },

<style>
/* ===========================================================================
   Component layer + theme tokens. In a production build these live in
   tailwind-build/input.css under @layer components / @layer base.
   Two themes via CSS variables on .app (.theme-admin / .theme-teacher).
   =========================================================================== */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: "Hanken Grotesk", system-ui, sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
button { font: inherit; color: inherit; }
input, select, textarea { font: inherit; }

.app { --radius: 14px; height: 100vh; display: flex; color: var(--ink); background: var(--bg); }
.theme-admin {
  --bg:#fbfbfc; --card:#fff; --line:#ebecf0; --line-strong:#dfe1e6;
  --ink:#1c1d24; --ink-soft:#5c5f6e; --ink-faint:#9a9da9;
  --accent:#b08a4f; --accent-deep:#8c6a37; --accent-soft:#f6efe2;
  --sb-bg:#16171d; --sb-fg:#f4f1ea; --sb-soft:#9a9cab; --sb-line:#2a2c36; --sb-active:rgba(255,255,255,.055);
  --field-bg:#fafafb;
}
.theme-teacher {
  --bg:#f7f9f6; --card:#fff; --line:#e8ece6; --line-strong:#dde2db;
  --ink:#1f261e; --ink-soft:#586155; --ink-faint:#929b8d;
  --accent:#5f8068; --accent-deep:#456049; --accent-soft:#e7efe7;
  --sb-bg:#edf0ea; --sb-fg:#28301f; --sb-soft:#79836f; --sb-line:#dde2d6; --sb-active:#fff;
  --field-bg:#f6f8f5;
}

.sidebar { width: 252px; min-width: 252px; height: 100%; background: var(--sb-bg); color: var(--sb-fg); padding: 28px 20px; display: flex; flex-direction: column; }
.theme-teacher .sidebar { border-right: 1px solid var(--sb-line); }
.brand { display: flex; align-items: center; gap: 11px; padding: 0 6px 28px; }
.brand .mk { width: 34px; height: 34px; min-width:34px; border-radius: 10px; background: linear-gradient(150deg, var(--accent), var(--accent-deep)); }
.brand .nm { font-family: "Spectral", serif; font-size: 20px; font-weight: 600; letter-spacing: -.01em; line-height: 1.1; }
.brand .nm small { display: block; font-family: "Hanken Grotesk", sans-serif; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--sb-soft); font-weight: 600; margin-top: 2px; }
.nav { display: flex; flex-direction: column; gap: 3px; }
.nav-sec { font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--sb-soft); padding: 14px 14px 8px; font-weight: 600; }
.nav-i { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; font-size: 14px; color: var(--sb-soft); font-weight: 500; cursor: pointer; border: 0; background: none; text-align: left; width: 100%; position: relative; transition: background .12s, color .12s; }
.nav-i:hover { color: var(--sb-fg); background: var(--sb-active); }
.nav-i .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .4; }
.nav-i.on { background: var(--sb-active); color: var(--sb-fg); font-weight: 600; }
.theme-teacher .nav-i.on { box-shadow: 0 1px 3px rgba(40,48,31,.08); }
.nav-i.on .dot { background: var(--accent); opacity: 1; }
.nav-i.on::before { content:""; position:absolute; left:-20px; top:9px; bottom:9px; width:3px; border-radius:0 3px 3px 0; background: var(--accent); }
.sb-foot { margin-top: auto; padding-top: 18px; border-top: 1px solid var(--sb-line); display: flex; align-items: center; gap: 11px; }
.sb-foot > div { min-width: 0; }
.sb-foot .nm { font-size: 13.5px; font-weight: 600; color: var(--sb-fg); white-space: nowrap; }
.sb-foot .rl { font-size: 12px; color: var(--sb-soft); }
.sb-foot .out { margin-left: auto; color: var(--sb-soft); background: none; border: 0; cursor: pointer; font-size: 16px; padding: 6px; border-radius: 8px; }
.sb-foot .out:hover { color: var(--sb-fg); background: var(--sb-active); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; }
.topbar { height: 72px; min-height: 72px; display: flex; align-items: center; gap: 18px; padding: 0 36px; border-bottom: 1px solid var(--line); background: var(--card); }
.search { display: flex; align-items: center; gap: 10px; background: var(--field-bg); border: 1px solid var(--line); border-radius: 11px; padding: 10px 14px; width: 340px; color: var(--ink-faint); }
.search input { border: 0; background: none; outline: none; color: var(--ink); width: 100%; font-size: 13.5px; }
.search input::placeholder { color: var(--ink-faint); }
.topbar-r { margin-left: auto; display: flex; align-items: center; gap: 14px; }

.lang { display: flex; gap: 2px; background: var(--field-bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.lang button { border: 0; background: none; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--ink-faint); padding: 6px 10px; border-radius: 7px; letter-spacing: .02em; }
.lang button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.theme-admin .lang button.on { background: var(--ink); color: #faf7f0; }
.theme-teacher .lang button.on { background: var(--accent); color: #fff; }

.icbtn { width: 40px; height: 40px; border-radius: 11px; background: var(--field-bg); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--ink-soft); cursor: pointer; font-size: 15px; }
.icbtn:hover { border-color: var(--line-strong); }

.content { flex: 1; overflow-y: auto; padding: 32px 36px 60px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
.page-head > div:first-child { min-width: 0; flex: 1; }
.crumb { font-size: 12.5px; color: var(--ink-faint); letter-spacing: .03em; margin-bottom: 8px; }
.h1 { font-family: "Spectral", serif; font-size: 31px; font-weight: 600; letter-spacing: -.02em; line-height: 1.05; }
.theme-teacher .h1 { font-family: "Hanken Grotesk", sans-serif; font-weight: 700; letter-spacing: -.025em; }
.sub { font-size: 14px; color: var(--ink-soft); margin-top: 7px; }

.btn { display: inline-flex; align-items: center; gap: 9px; border: 1px solid transparent; border-radius: 11px; padding: 11px 18px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: filter .12s, background .12s; }
.btn .plus { font-size: 17px; margin-top: -1px; }
.btn-primary { background: var(--ink); color: #faf7f0; }
.theme-teacher .btn-primary { background: var(--accent); color: #fff; }
.btn-primary .plus { color: var(--accent); }
.theme-teacher .btn-primary .plus { color: #fff; }
.btn-primary:hover { filter: brightness(1.12); }
.btn-ghost { background: var(--card); border-color: var(--line-strong); color: var(--ink-soft); }
.btn-ghost:hover { color: var(--ink); border-color: var(--ink-faint); }
.btn-accent { background: var(--accent); color: #fff; }
.btn-accent:hover { background: var(--accent-deep); }
.btn-sm { padding: 8px 13px; font-size: 13px; border-radius: 9px; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 15px; padding: 18px 20px; }
.stat .lab { font-size: 12.5px; color: var(--ink-soft); }
.stat .val { font-family: "Spectral", serif; font-size: 32px; font-weight: 600; margin-top: 6px; line-height: 1; }
.theme-teacher .stat .val { font-family: "Hanken Grotesk", sans-serif; font-weight: 700; letter-spacing: -.02em; }
.stat .nt { font-size: 12px; color: var(--accent-deep); margin-top: 6px; font-weight: 600; }

.panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.panel-h { display: flex; align-items: center; gap: 12px; padding: 17px 22px; border-bottom: 1px solid var(--line); }
.panel-h .ti { font-size: 15.5px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
.panel-h .ct { font-size: 12.5px; color: var(--ink-faint); }
.panel-h .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.grid-2 { display: grid; grid-template-columns: 1.5fr 1fr; gap: 18px; }
.cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

.chips { display: flex; gap: 7px; flex-wrap: wrap; }
.chip { padding: 8px 15px; border-radius: 20px; font-size: 13px; color: var(--ink-soft); border: 1px solid var(--line-strong); font-weight: 500; cursor: pointer; background: var(--card); }
.chip:hover { border-color: var(--ink-faint); }
.chip.on { background: var(--accent-soft); color: var(--accent-deep); border-color: transparent; font-weight: 600; }

.badge { font-size: 12.5px; font-weight: 600; padding: 4px 11px; border-radius: 7px; display: inline-block; white-space: nowrap; }
.badge-cls { color: var(--accent-deep); background: var(--accent-soft); }
.badge-soft { color: var(--ink-soft); background: var(--field-bg); border: 1px solid var(--line); }
.badge-good { color:#3f7a4e; background:#e6f1e8; }
.badge-fair { color:#9a6a2e; background:#f6eede; }
.badge-avg { color:#5c5f6e; background:#eef0f3; }

.tbl { width: 100%; border-collapse: collapse; }
.tbl thead th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint); padding: 13px 22px; background: var(--field-bg); border-bottom: 1px solid var(--line); }
.tbl tbody td { padding: 13px 22px; border-bottom: 1px solid var(--line); font-size: 14.5px; vertical-align: middle; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover { background: var(--field-bg); }
.cell-name { display: flex; align-items: center; gap: 12px; }
.cell-name .nm { font-weight: 600; white-space: nowrap; }
.id { font-variant-numeric: tabular-nums; color: var(--ink-soft); font-size: 13.5px; }
.sex { color: var(--ink-soft); }
.rowact { text-align: right; white-space: nowrap; }
.iconbtn { border: 0; background: none; cursor: pointer; color: var(--ink-faint); font-size: 13px; padding: 6px 8px; border-radius: 7px; font-weight: 600; }
.iconbtn:hover { color: var(--ink); background: var(--field-bg); }
.iconbtn.danger:hover { color: #b3492f; background: #f8ebe7; }

.field { display: flex; flex-direction: column; gap: 7px; }
.field > label { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); }
.field .inp, .field select, .field textarea { border: 1px solid var(--line-strong); background: var(--field-bg); border-radius: 10px; padding: 11px 13px; font-size: 14px; color: var(--ink); outline: none; width: 100%; }
.field .inp:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); background: var(--card); }
.field textarea { resize: vertical; min-height: 110px; line-height: 1.55; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-grid .full { grid-column: 1 / -1; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; border: 1px solid var(--line-strong); background: var(--field-bg); border-radius: 10px; padding: 11px; font-size: 13.5px; font-weight: 600; color: var(--ink-soft); cursor: pointer; }
.seg button.on { background: var(--accent-soft); color: var(--accent-deep); border-color: var(--accent); }

.overlay { position: fixed; inset: 0; background: rgba(20,22,30,.45); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 24px; animation: fade .15s ease; }
@keyframes fade { from { opacity: 0; } }
.modal { background: var(--card); border-radius: 18px; width: 100%; max-width: 560px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 30px 80px -30px rgba(0,0,0,.5); animation: pop .16s ease; }
@keyframes pop { from { transform: translateY(12px) scale(.985); opacity: 0; } }
.modal-h { display: flex; align-items: center; padding: 22px 24px; border-bottom: 1px solid var(--line); }
.modal-h .ti { font-family: "Spectral", serif; font-size: 20px; font-weight: 600; }
.theme-teacher .modal-h .ti { font-family: "Hanken Grotesk", sans-serif; font-weight: 700; }
.modal-h .x { margin-left: auto; border: 0; background: var(--field-bg); width: 34px; height: 34px; border-radius: 9px; cursor: pointer; color: var(--ink-soft); font-size: 16px; }
.modal-h .x:hover { color: var(--ink); }
.modal-b { padding: 24px; overflow-y: auto; }
.modal-f { display: flex; gap: 10px; justify-content: flex-end; padding: 18px 24px; border-top: 1px solid var(--line); }

.sched { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
.sched th { font-size: 12px; font-weight: 600; color: var(--ink-soft); padding: 12px 8px; text-align: center; border-bottom: 1px solid var(--line); }
.sched th.corner { width: 92px; }
.sched td { border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); padding: 6px; height: 78px; vertical-align: top; }
.sched td.per { border-left: 0; text-align: center; color: var(--ink-faint); font-size: 12px; font-weight: 600; background: var(--field-bg); }
.sched td.per b { display: block; color: var(--ink); font-size: 13.5px; }
.slot { height: 100%; border-radius: 9px; padding: 8px 9px; font-size: 12.5px; line-height: 1.25; }
.slot .s-subj { font-weight: 700; }
.slot .s-meta { color: var(--ink-soft); font-size: 11.5px; margin-top: 3px; }
.slot.filled { background: var(--field-bg); border: 1px solid var(--line); }
.slot.mine { background: var(--accent-soft); border: 1px solid color-mix(in oklab, var(--accent) 35%, transparent); }
.slot.mine .s-meta { color: var(--accent-deep); }

.avg-pill { font-variant-numeric: tabular-nums; font-weight: 700; padding: 5px 11px; border-radius: 8px; background: var(--accent-soft); color: var(--accent-deep); display: inline-block; min-width: 46px; text-align: center; }
.avg-pill.empty { background: var(--field-bg); color: var(--ink-faint); }
.gradeinp { width: 64px; text-align: center; border: 1px solid var(--line-strong); background: var(--field-bg); border-radius: 9px; padding: 8px 4px; font-size: 14px; color: var(--ink); outline: none; font-variant-numeric: tabular-nums; }
.gradeinp:focus { border-color: var(--accent); background: var(--card); }

.empty { text-align: center; padding: 60px 20px; color: var(--ink-faint); }
.empty .big { font-family: "Spectral", serif; font-size: 19px; color: var(--ink-soft); margin-bottom: 6px; }

.toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #faf7f0; padding: 13px 22px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 80; box-shadow: 0 16px 40px -16px rgba(0,0,0,.5); display: flex; align-items: center; gap: 10px; animation: toastin .2s ease; }
.toast .tick { color: var(--accent); }
@keyframes toastin { from { transform: translate(-50%, 14px); opacity: 0; } }

.login { height: 100vh; width: 100%; display: flex; --accent:#b08a4f; --accent-deep:#8c6a37; --accent-soft:#f6efe2; --ink:#1c1d24; --ink-soft:#5c5f6e; --ink-faint:#9a9da9; --line:#e8e6df; --line-strong:#dcd9cf; --field-bg:#faf8f3; color: var(--ink); }
.login-art { width: 44%; background: #16171d; color: #f4f1ea; padding: 56px 52px; display: flex; flex-direction: column; position: relative; overflow: hidden; }
.login-art .mk { width: 44px; height: 44px; border-radius: 13px; background: linear-gradient(150deg, var(--accent), var(--accent-deep)); }
.login-art .glow { position: absolute; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(circle, rgba(176,138,79,.22), transparent 65%); right: -180px; bottom: -160px; }
.login-art h2 { font-family: "Spectral", serif; font-size: 40px; font-weight: 600; letter-spacing: -.02em; line-height: 1.12; margin: auto 0 0; white-space: pre-line; }
.login-art p { color: #9a9cab; font-size: 15px; line-height: 1.6; margin-top: 18px; max-width: 34ch; }
.login-art .foot { margin-top: 26px; font-size: 12.5px; color: #6f717e; letter-spacing: .03em; }
.login-form { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #faf8f3; padding: 40px; }
.login-card { width: 100%; max-width: 392px; }
.login-card .lang { margin: 0 0 28px auto; background:#fff; border:1px solid var(--line); width: max-content; }
.login-card .lang button.on { background:#16171d; color:#faf7f0; }
.login-card h1 { font-family: "Spectral", serif; font-size: 30px; font-weight: 600; letter-spacing: -.02em; }
.login-card .ls { color: var(--ink-soft); font-size: 14.5px; margin-top: 8px; }
.role-label { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); margin: 28px 0 12px; }
.roles { display: flex; flex-direction: column; gap: 10px; }
.role { display: flex; align-items: center; gap: 14px; border: 1px solid var(--line-strong); background: #fff; border-radius: 14px; padding: 16px; cursor: pointer; text-align: left; transition: border-color .12s, box-shadow .12s; width: 100%; }
.role:hover { border-color: var(--accent); }
.role.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.role .ricon { width: 42px; height: 42px; min-width: 42px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-family: "Spectral", serif; font-size: 19px; font-weight: 600; }
.role.admin .ricon { background: #16171d; color: var(--accent); }
.role.teacher .ricon { background: var(--accent-soft); color: var(--accent-deep); }
.role .rt { font-size: 15px; font-weight: 700; }
.role .rd { font-size: 12.5px; color: var(--ink-soft); margin-top: 3px; line-height: 1.4; }
.role .rcheck { margin-left: auto; width: 20px; height: 20px; min-width: 20px; border-radius: 50%; border: 2px solid var(--line-strong); }
.role.on .rcheck { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 3px #fff; }
.login-fields { margin-top: 22px; display: flex; flex-direction: column; gap: 14px; }
.login-fields .field .inp { background: #fff; }
.login-card .btn-primary { width: 100%; justify-content: center; background: #16171d; color: #faf7f0; margin-top: 22px; padding: 14px; }
.login-card .btn-primary .plus { display: none; }
.login-demo { text-align: center; font-size: 12.5px; color: var(--ink-faint); margin-top: 16px; }
@media (max-width: 900px) { .login-art { display: none; } }
</style>

  for (var k in WEIGHTS) { var v = parseFloat(g[k]); if (!isNaN(v)) { sum += v * WEIGHTS[k]; w += WEIGHTS[k]; } }
  if (!w) return null;
  return Math.round((sum / w) * 10) / 10;
}

}
function nextId(list, prefix) {

  list.forEach(function (x) { var m = (x.id || "").replace(prefix, "").match(/\d+/); if (m) max = Math.max(max, parseInt(m[0], 10)); });
  return prefix + String(max + 1).padStart(2, "0");
}

  var dateStr = new Intl.DateTimeFormat(undefined, { weekday: "long", day: "numeric", month: "long" }).format(new Date());
  return pageHead(T("nav.tOverview"), T("to.greeting") + ", " + m.name, T("to.sub")) +
    '<div class="stats" style="grid-template-columns:repeat(3,1fr)">' + stats + '</div>' +
    '<div class="grid-2 mt-[18px]">' +
      '<div class="panel"><div class="panel-h"><span class="ti">' + esc(T("to.today")) + '</span><span class="ct">' + esc(dateStr) + '</span></div><div>' + todayHTML + '</div></div>' +
      '<div class="panel"><div class="panel-h"><span class="ti">' + esc(T("to.myClasses")) + '</span></div><div style="padding:10px 0">' + classHTML + '</div></div>' +
    '</div>';
}

/* ============================ TEACHER: homeroom ============================ */
function teacherHomeroom() {
  var m = me();
  var list = DATA.students.filter(function (s) { return s.cls === m.homeroom; });
  var rows = list.map(function (s) {
    var cm = DATA.comments[s.id];
    var conduct = cm && cm.conduct ? badge(cm.conduct === "good" ? "good" : cm.conduct === "fair" ? "fair" : "avg", T("conduct." + cm.conduct)) : '<span style="color:var(--ink-faint)">—</span>';
    return '<tr><td class="id">' + esc(s.id) + '</td>' +
      '<td><span class="cell-name">' + avatar(s.name) + '<span class="nm">' + esc(s.name) + '</span></span></td>' +
      '<td>' + esc(s.dob) + '</td><td class="sex">' + esc(sexLabel(s.sex)) + '</td><td>' + conduct + '</td>' +
      '<td class="rowact"><button class="iconbtn" data-act="goto-comment" data-id="' + s.id + '">' + esc(T("to.openComments")) + '</button></td></tr>';
  }).join("");
  return pageHead(T("hr.crumb"), T("hr.title", { cls: m.homeroom }), T("hr.sub", { n: list.length })) +
    '<div class="panel"><table class="tbl"><thead><tr><th>' + esc(T("f.id")) + '</th><th>' + esc(T("f.name")) + '</th><th>' + esc(T("f.dob")) + '</th><th>' + esc(T("f.sex")) + '</th><th>' + esc(T("cm.conduct")) + '</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

/* ============================ TEACHER: grade entry ============================ */
function teacherGrades() {
  var m = me();
  var classes = myClasses(m.id);
  if (!STATE.gradeClass || classes.indexOf(STATE.gradeClass) < 0) STATE.gradeClass = classes[0];
  var subj = m.subject, cls = STATE.gradeClass;
  var list = DATA.students.filter(function (s) { return s.cls === cls; });
  var cols = [["oral", "ge.oral"], ["m15", "ge.m15"], ["m45", "ge.m45"], ["final", "ge.final"]];
  var chips = classes.map(function (c) { return '<span class="chip' + (cls === c ? " on" : "") + '" data-act="grade-class" data-cls="' + c + '">' + esc(c) + '</span>'; }).join("");
  var thead = '<tr><th>' + esc(T("f.name")) + '</th>' + cols.map(function (c) { return '<th style="text-align:center">' + esc(T(c[1])) + '</th>'; }).join("") + '<th style="text-align:center">' + esc(T("ge.avg")) + '</th></tr>';
  var rows = list.map(function (s) {
    var g = DATA.grades[s.id + "|" + subj] || {};
    var avg = computeAvg(g);
    var inputs = cols.map(function (c) {
      var k = c[0];
      return '<td style="text-align:center"><input class="gradeinp" inputmode="decimal" data-grade="1" data-sid="' + s.id + '" data-subj="' + subj + '" data-field="' + k + '" value="' + (g[k] != null ? esc(g[k]) : "") + '"></td>';
    }).join("");
    return '<tr><td><span class="cell-name">' + avatar(s.name, 34) + '<span class="nm">' + esc(s.name) + '</span></span></td>' + inputs +
      '<td style="text-align:center"><span class="avg-pill' + (avg == null ? " empty" : "") + '">' + (avg == null ? "—" : avg.toFixed(1)) + '</span></td></tr>';
  }).join("");
  return pageHead(T("ge.crumb"), T("ge.title"), null,
      '<button class="btn btn-primary" data-act="save-grades" data-cls="' + cls + '">' + esc(T("ge.save")) + '</button>') +
    '<div class="panel"><div class="panel-h"><span class="ti">' + esc(subjName(subj)) + '</span><span class="ct">' + esc(T("ge.hint")) + '</span><div class="right"><div class="chips">' + chips + '</div></div></div>' +
    '<table class="tbl"><thead>' + thead + '</thead><tbody>' + rows + '</tbody></table></div>';
}

/* ============================ TEACHER: comments ============================ */
function teacherComments() {
  var m = me();
  var list = DATA.students.filter(function (s) { return s.cls === m.homeroom; });
  if (!STATE.commentStudent || !list.find(function (s) { return s.id === STATE.commentStudent; })) STATE.commentStudent = list[0] ? list[0].id : null;
  var sid = STATE.commentStudent;
  var cur = (sid && DATA.comments[sid]) || {};
  var conduct = cur.conduct || "good";

  var picker = list.map(function (s) {
    var on = sid === s.id;
    return '<button data-act="pick-student" data-id="' + s.id + '" style="width:100%;display:flex;align-items:center;gap:11px;padding:11px 22px;border:0;background:' + (on ? "var(--field-bg)" : "none") + ';cursor:pointer;text-align:left;border-left:3px solid ' + (on ? "var(--accent)" : "transparent") + '">' +
      avatar(s.name, 34) + '<div style="min-width:0"><div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(s.name) + '</div><div style="font-size:12px;color:var(--ink-faint)">' + esc(s.id) + '</div></div></button>';
  }).join("");

  var student = list.find(function (s) { return s.id === sid; });
  var seg = ["good", "fair", "avg"].map(function (v) { return '<button type="button" class="' + (conduct === v ? "on" : "") + '" data-act="seg" data-target="cm-conduct" data-value="' + v + '">' + esc(T("conduct." + v)) + '</button>'; }).join("");
  var detail = student ?
    '<div class="panel-h"><span class="cell-name">' + avatar(student.name) + '<span class="ti">' + esc(student.name) + '</span></span><span class="ct">' + esc(student.id) + ' · ' + esc(m.homeroom) + '</span></div>' +
    '<div style="padding:22px">' +
      '<input type="hidden" id="cm-conduct" value="' + conduct + '">' +
      '<div class="field"><label>' + esc(T("cm.conduct")) + '</label><div class="seg">' + seg + '</div></div>' +
      '<div style="height:18px"></div>' +
      '<div class="field"><label>' + esc(T("cm.note")) + '</label><textarea id="cm-text" placeholder="' + esc(T("cm.placeholder")) + '">' + esc(cur.text || "") + '</textarea></div>' +
      '<div style="margin-top:18px;text-align:right"><button class="btn btn-accent" data-act="save-comment" data-id="' + sid + '">' + esc(T("cm.save")) + '</button></div>' +
    '</div>'
    : '<div class="empty"><div class="big">' + esc(T("cm.empty")) + '</div></div>';

  return pageHead(T("cm.crumb"), T("cm.title"), T("hr.title", { cls: m.homeroom })) +
    '<div class="grid-2" style="grid-template-columns:300px 1fr">' +
      '<div class="panel"><div class="panel-h"><span class="ti">' + esc(T("cm.select")) + '</span></div><div style="padding:8px 0;max-height:520px;overflow-y:auto">' + picker + '</div></div>' +
      '<div class="panel">' + detail + '</div>' +
    '</div>';
}

/* ============================ TEACHER: schedule ============================ */
function teacherSchedule() {
  var m = me();
  return pageHead(T("sch.myCrumb"), T("sch.mine"), subjName(m.subject)) +
    '<div class="panel"><div style="padding:22px">' + scheduleGrid({ teacherId: m.id }) + '</div></div>';
}

/* ============================ MODALS ============================ */
function studentModalHTML(student) {
  var f = student || { name: "", dob: "", cls: DATA.classes[0].id, sex: "Nam" };
  var clsOpts = DATA.classes.map(function (c) { return '<option value="' + c.id + '"' + (f.cls === c.id ? " selected" : "") + '>' + esc(c.id) + '</option>'; }).join("");
  var seg = [["Nam", "sex.male"], ["Nữ", "sex.female"]].map(function (o) { return '<button type="button" class="' + (f.sex === o[0] ? "on" : "") + '" data-act="seg" data-target="f-sex" data-value="' + o[0] + '">' + esc(T(o[1])) + '</button>'; }).join("");
  return modalShell(student ? T("stu.edit") : T("stu.add"), "student", student ? student.id : "",
    '<div class="flex items-center gap-[14px]" style="margin-bottom:20px">' + avatar(f.name || "?", 56) + '<div style="font-size:12.5px;color:var(--ink-soft)">' + esc(T("f.photoHint")) + '</div></div>' +
    '<div class="form-grid">' +
      '<div class="field full"><label>' + esc(T("f.name")) + '</label><input class="inp" id="f-name" value="' + esc(f.name) + '" placeholder="Nguyễn Văn A"></div>' +
      '<div class="field"><label>' + esc(T("f.dob")) + '</label><input class="inp" id="f-dob" value="' + esc(f.dob) + '" placeholder="dd/mm/yyyy"></div>' +
      '<div class="field"><label>' + esc(T("f.class")) + '</label><select id="f-cls">' + clsOpts + '</select></div>' +
      '<div class="field full"><label>' + esc(T("f.sex")) + '</label><input type="hidden" id="f-sex" value="' + esc(f.sex) + '"><div class="seg">' + seg + '</div></div>' +
    '</div>');
}
function teacherModalHTML(teacher) {
  var f = teacher || { name: "", dob: "", subject: "math", homeroom: "", sex: "Nam" };
  var subjOpts = SUBJECTS.map(function (s) { return '<option value="' + s + '"' + (f.subject === s ? " selected" : "") + '>' + esc(subjName(s)) + '</option>'; }).join("");
  var hrOpts = '<option value=""' + (!f.homeroom ? " selected" : "") + '>' + esc(T("f.none")) + '</option>' +
    DATA.classes.map(function (c) { return '<option value="' + c.id + '"' + (f.homeroom === c.id ? " selected" : "") + '>' + esc(c.id) + '</option>'; }).join("");
  var seg = [["Nam", "sex.male"], ["Nữ", "sex.female"]].map(function (o) { return '<button type="button" class="' + (f.sex === o[0] ? "on" : "") + '" data-act="seg" data-target="f-sex" data-value="' + o[0] + '">' + esc(T(o[1])) + '</button>'; }).join("");
  return modalShell(teacher ? T("tch.edit") : T("tch.add"), "teacher", teacher ? teacher.id : "",
    '<div class="flex items-center gap-[14px]" style="margin-bottom:20px">' + avatar(f.name || "?", 56) + '<div style="font-size:12.5px;color:var(--ink-soft)">' + esc(T("f.photoHint")) + '</div></div>' +
    '<div class="form-grid">' +
      '<div class="field full"><label>' + esc(T("f.name")) + '</label><input class="inp" id="f-name" value="' + esc(f.name) + '" placeholder="Trần Thị B"></div>' +
      '<div class="field"><label>' + esc(T("f.subject")) + '</label><select id="f-subject">' + subjOpts + '</select></div>' +
      '<div class="field"><label>' + esc(T("f.homeroom")) + '</label><select id="f-homeroom">' + hrOpts + '</select></div>' +
      '<div class="field"><label>' + esc(T("f.dob")) + '</label><input class="inp" id="f-dob" value="' + esc(f.dob) + '" placeholder="dd/mm/yyyy"></div>' +
      '<div class="field"><label>' + esc(T("f.sex")) + '</label><input type="hidden" id="f-sex" value="' + esc(f.sex) + '"><div class="seg">' + seg + '</div></div>' +
    '</div>');
}
function modalShell(title, kind, id, body) {
  return '<div class="overlay" data-act="overlay"><div class="modal">' +
    '<div class="modal-h"><span class="ti">' + esc(title) + '</span><button class="x" data-act="modal-close">✕</button></div>' +
    '<div class="modal-b">' + body + '</div>' +
    '<div class="modal-f"><button class="btn btn-ghost" data-act="modal-close">' + esc(T("cancel")) + '</button>' +
    '<button class="btn btn-accent" data-act="modal-save" data-kind="' + kind + '" data-id="' + id + '">' + esc(T("save")) + '</button></div>' +
    '</div></div>';
}
function openModal(kind, id) {
  var html = kind === "student" ? studentModalHTML(id ? findStudent(id) : null) : teacherModalHTML(id ? findTeacher(id) : null);
  document.getElementById("modal-root").innerHTML = html;
}
function closeModal() { document.getElementById("modal-root").innerHTML = ""; }

/* ============================ TOAST ============================ */
var toastTimer = null;
function toast(msg) {
  var root = document.getElementById("toast-root");
  root.innerHTML = '<div class="toast"><span class="tick">✓</span>' + esc(msg) + '</div>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { root.innerHTML = ""; }, 2400);
}

/* ============================ RENDER ============================ */
function render() {
  var app = document.getElementById("app");
  if (!STATE.auth) { app.className = ""; app.innerHTML = renderLogin(); return; }
  app.className = "app theme-" + STATE.auth.role;
  app.innerHTML = renderShell();
}

/* ============================ CONTROLLER ============================ */
function setLang(l) { STATE.lang = l; lsSet("qlhstw.lang", l); render(); }
function navigate(screen) { STATE.screen = screen; STATE.search = ""; lsSet("qlhstw.screen", screen); render(); }
function doLogin() {
  var u = USERS[STATE.loginRole];
  STATE.auth = u; STATE.screen = DEFAULT_SCREEN[u.role];
  lsSet("qlhstw.auth", u); lsSet("qlhstw.screen", STATE.screen);
  render();
}
function doLogout() {
  STATE.auth = null; STATE.screen = null;
  localStorage.removeItem("qlhstw.auth"); localStorage.removeItem("qlhstw.screen");
  render();
}

document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-act]");
  if (!el) return;
  var act = el.dataset.act;
  switch (act) {
    case "lang": setLang(el.dataset.lang); break;
    case "role": STATE.loginRole = el.dataset.role; render(); break;
    case "login": doLogin(); break;
    case "logout": doLogout(); break;
    case "nav": navigate(el.dataset.screen); break;
    case "filter": STATE.filterClass = el.dataset.cls; render(); break;
    case "add-student": openModal("student", null); break;
    case "edit-student": openModal("student", el.dataset.id); break;
    case "del-student": { var s = findStudent(el.dataset.id); if (s && confirm(T("del.confirm", { name: s.name }))) { deleteStudent(s.id); render(); } break; }
    case "add-teacher": openModal("teacher", null); break;
    case "edit-teacher": openModal("teacher", el.dataset.id); break;
    case "del-teacher": { var tt = findTeacher(el.dataset.id); if (tt && confirm(T("del.confirm", { name: tt.name }))) { deleteTeacher(tt.id); render(); } break; }
    case "modal-close": closeModal(); break;
    case "overlay": if (e.target === el) closeModal(); break;
    case "modal-save": saveModal(el.dataset.kind, el.dataset.id); break;
    case "seg": handleSeg(el); break;
    case "view-class": STATE.filterClass = el.dataset.cls; navigate("students"); break;
    case "sched-class": STATE.scheduleClass = el.dataset.cls; render(); break;
    case "grade-class": STATE.gradeClass = el.dataset.cls; render(); break;
    case "save-grades": toast(T("ge.saved", { cls: el.dataset.cls })); break;
    case "pick-student": STATE.commentStudent = el.dataset.id; render(); break;
    case "goto-comment": STATE.commentStudent = el.dataset.id; navigate("comments"); break;
    case "save-comment": saveComment(el.dataset.id); break;
  }
});

function handleSeg(el) {
  var target = document.getElementById(el.dataset.target);
  if (target) target.value = el.dataset.value;
  var sibs = el.parentNode.querySelectorAll("button");
  sibs.forEach(function (b) { b.classList.toggle("on", b === el); });
}

function saveModal(kind, id) {
  var name = (document.getElementById("f-name").value || "").trim();
  if (!name) { document.getElementById("f-name").focus(); return; }
  var dob = document.getElementById("f-dob").value;
  var sex = document.getElementById("f-sex").value;
  if (kind === "student") {
    var cls = document.getElementById("f-cls").value;
    if (id) updateStudent(id, { name: name, dob: dob, cls: cls, sex: sex });
    else addStudent({ name: name, dob: dob, cls: cls, sex: sex });
  } else {
    var subject = document.getElementById("f-subject").value;
    var homeroom = document.getElementById("f-homeroom").value;
    if (id) updateTeacher(id, { name: name, dob: dob, subject: subject, homeroom: homeroom, sex: sex });
    else addTeacher({ name: name, dob: dob, subject: subject, homeroom: homeroom, sex: sex });
  }
  closeModal(); render(); toast(T("saved"));
}

function saveComment(sid) {
  var text = document.getElementById("cm-text").value;
  var conduct = document.getElementById("cm-conduct").value;
  setComment(sid, { text: text, conduct: conduct });
  var s = findStudent(sid);
  toast(T("cm.saved", { name: s ? s.name : "" }));
}

/* live search (partial update — keeps focus) */
document.addEventListener("input", function (e) {
  var t = e.target;
  if (t.id === "stu-search") {
    STATE.search = t.value;
    document.getElementById("stu-tbody").innerHTML = studentRows();
    document.getElementById("stu-count").textContent = T("stu.records", { n: filteredStudents().length });
  } else if (t.id === "tch-search") {
    STATE.search = t.value;
    document.getElementById("tch-tbody").innerHTML = teacherRows();
    document.getElementById("tch-count").textContent = T("tch.records", { n: filteredTeachers().length });
  } else if (t.dataset && t.dataset.grade) {
    var v = t.value.replace(",", ".");
    if (v !== "" && (isNaN(parseFloat(v)) || parseFloat(v) < 0 || parseFloat(v) > 10)) { t.value = DATA.grades[t.dataset.sid + "|" + t.dataset.subj] ? (DATA.grades[t.dataset.sid + "|" + t.dataset.subj][t.dataset.field] || "") : ""; return; }
    setGrade(t.dataset.sid, t.dataset.subj, t.dataset.field, v);
    var tr = t.closest("tr");
    var g = DATA.grades[t.dataset.sid + "|" + t.dataset.subj];
    var avg = computeAvg(g);
    var pill = tr.querySelector(".avg-pill");
    pill.className = "avg-pill" + (avg == null ? " empty" : "");
    pill.textContent = avg == null ? "—" : avg.toFixed(1);
  }
});

document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && document.getElementById("modal-root").innerHTML) closeModal();
});

/* boot */
render();

</script>
</body>
</html>
